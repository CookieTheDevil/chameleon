<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Chameleon</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/game.css">

        <link
            href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Ubuntu+Mono:wght@400;700&display=swap"
            rel="stylesheet"
        >
    </head>
    <body>
        <main class="game-page">
            <header class="site-header">
                <img
                    class="header-chameleon"
                    src="images/chameleonNBG.svg"
                    alt="Green chameleon sitting on a branch"
                >

                <div class="header-content">
                    <h1>Chameleon</h1>
                    <h2 id="role-line" class="game-role-line">
                        Loading...
                    </h2>
                </div>
            </header>

            <section class="game-board-panel">
                <h3 id="category-title" class="game-category-title">
                    Category: Loading...
                </h3>

                <div id="board-grid" class="board-grid">
                    <!-- Filled by JavaScript -->
                </div>
            </section>

            <button
                id="return-to-lobby-button"
                class="return-to-lobby-button"
                type="button"
                hidden
            >
                Round finished &rarr; back to lobby
            </button>
        </main>

        <script src="/socket.io/socket.io.js"></script>
        <script src="js/game.js" defer></script>
    </body>
</html>
